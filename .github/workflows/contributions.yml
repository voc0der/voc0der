name: Update upstream contributions

on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_contributions.py
      - .github/workflows/contributions.yml

permissions:
  contents: write

concurrency:
  group: profile-contributions
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Refresh public contribution panels
        run: python3 scripts/update_contributions.py
      - name: Commit refreshed panels
        run: |
          git add assets/contributions-*.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh upstream contribution stats"
          git push
